name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: library and types
    # No services. The library knows nothing about any application, and
    # everything here can be checked without infrastructure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run typecheck
      - name: No references to the origin application
        run: bun run leaks
      - name: Tests
        run: bun test packages

  template:
    name: the template, as an application
    # The template is a workspace member and is run here, not merely compiled.
    # It is the only evidence that what `create-pleyn` hands somebody works.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pleyn
          POSTGRES_PASSWORD: pleyn
          POSTGRES_DB: pleyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pleyn -d pleyn"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pleyn:pleyn@127.0.0.1:5432/pleyn
      SECRET_KEY: a-key-that-is-only-for-continuous-integration
    defaults:
      run:
        working-directory: templates/app
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Checks
        run: bun run check
      - name: The full suite
        run: bun run test:db

  cli:
    name: create-pleyn, end to end
    # Generates a project and runs its own checks inside it. `--no-docker`
    # because the Postgres above is already there; the Docker branch is
    # exercised by using this for real.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - name: Create the database the generated project will ask for
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE ROLE \"trial-app\" LOGIN PASSWORD 'trial-app';"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE DATABASE \"trial-app\" OWNER \"trial-app\";"
      # `--no-install` so the generated project can be pointed at the
      # workspace copy of htmx-contract first. Until the library is published,
      # resolving `^0.1.0` from the registry is a 404 — which is a fact about
      # the release order, not about this code, and is not worth failing CI
      # over every day until then.
      - name: Generate a project
        run: bun packages/create-pleyn/index.ts "$RUNNER_TEMP/trial-app" --no-docker --no-git --no-install
      - name: Point it at the library in this checkout
        run: |
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.devDependencies["htmx-contract"] = "file:" + process.argv[2];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          ' "$RUNNER_TEMP/trial-app/package.json" "$GITHUB_WORKSPACE/packages/htmx-contract"
      - name: Install, migrate, seed and build
        run: |
          bun install
          bun run db:apply
          bun run cli seed
          bun run css
        working-directory: ${{ runner.temp }}/trial-app
      - name: Run its own checks
        run: bun run ok
        working-directory: ${{ runner.temp }}/trial-app
      - name: Run its full suite
        run: bun run test:db
        working-directory: ${{ runner.temp }}/trial-app
